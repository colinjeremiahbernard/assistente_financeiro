[project]
name = "mock-plaid-mcp"
version = "1.0.0"
description = "Servidor MCP STDIO que simula o Plaid Sandbox com dados fictícios em BRL"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[project.scripts]
mock-plaid-mcp = "server:main"
